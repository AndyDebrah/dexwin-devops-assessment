apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-api
  namespace: assessment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-api
  template:
    metadata:
      labels:
        app: customer-api
    spec:
      containers:
        - name: customer-api
          image: customer-api:assessment
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: customer-api-config
                secretRef:
                  name:customer-api-secret 
          ports:
            - name: http
              containerPort: 8080
      startupProbe:
          httpGet:
            path: /healthz
          periodSeconds: 2
          failureThreshold: 15 
      readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 3
            failureThreshold: 2
      livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 3
